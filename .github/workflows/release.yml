name: "🚀 Release VO-SE Vocal Studio"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: "🚀 Build & Release Web Application"
    runs-on: ubuntu-latest

    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "📦 Install Dependencies"
        run: npm ci

      - name: "🏗️ Build Application"
        run: npm run build

      - name: "🗜️ Archive Build Output"
        run: tar -czf vose-vocal-studio-web.tar.gz dist/ server.js package.json

      - name: "🚀 Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "VO-SE Vocal Studio (${{ github.ref_name }})"
          files: vose-vocal-studio-web.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
