name: "🎙️ VO-SE Vocal Studio Web CI"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "🛠️ Build & Validate Web Studio"
    runs-on: ubuntu-latest

    steps:
      - name: "📂 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "📦 Install Dependencies"
        run: npm ci

      - name: "🔍 Lint"
        run: npm run lint

      - name: "🏗️ Build Production Bundle"
        run: npm run build

      - name: "📦 Upload Web Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: vose-web-dist
          path: dist/
